# =============================================================
# Decap CMS 后台配置 — NJRUI Mobile Home (naijirui.com)
# =============================================================

backend:
  name: github
  repo: lmzbguo-hue/naijirui # ⚠️ 请替换为你的 GitHub 账户名/仓库名
  branch: main
  base_url: https://decap-cms-oauth.vercel.app # 使用稳定可用的 OAuth 代理后端
  auth_endpoint: auth

# 本机编辑模式: 配合 npx decap-server 使用

# 图片上传路径
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ---------------- 博客文章 ----------------
  - name: blog
    label: "博客文章 Blog Posts"
    label_singular: "文章 Blog Post"
    folder: "src/content/blog"
    create: true
    slug: "{{postKey}}-{{lang}}"
    fields:
      - { label: "文章标识 postKey（英文短横线，四个语言版本必须相同）", name: postKey, widget: string, hint: "例如 how-to-choose-container-house，生成 /blog/how-to-choose-container-house/" }
      - { label: "语言 Language", name: lang, widget: select, options: ["en", "zh", "ar", "fr"] }
      - { label: "日期 Date", name: date, widget: date, format: "YYYY-MM-DD" }
      - { label: "标题 Title", name: title, widget: string }
      - { label: "SEO 标题（可留空，留空用文章标题）", name: seoTitle, widget: string, required: false }
      - { label: "SEO 描述（给谷歌看的 1-2 句）", name: seoDesc, widget: text, required: false }
      - { label: "摘要（博客列表页显示）", name: excerpt, widget: text }
      - { label: "正文 Body（# 小标题 / 段落 / 图片）", name: body, widget: markdown }

  # ---------------- 产品 ----------------
  - name: products
    label: "产品 Products"
    label_singular: "产品 Product"
    folder: "src/data/products/items"
    create: true
    extension: json
    format: json
    identifier_field: slug
    slug: "{{slug}}"
    fields:
      - { label: "产品标识 slug（英文短横线，唯一）", name: slug, widget: string, hint: "例如 20ft-double-wing-expandable-box，生成 /products/分类/slug/" }
      - { label: "所属分类 Category", name: category, widget: select, options: ["folding-expandable-container-house", "flat-pack-container-house", "modular-prefab-house", "temporary-site-camp-accommodation", "prefab-villa"] }
      - label: "产品名（4 语言）"
        name: name
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "短名（卡片显示，4 语言）"
        name: shortName
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "SEO 标题（4 语言）"
        name: seoTitle
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "SEO 描述（4 语言）"
        name: seoDesc
        widget: object
        fields:
          - { label: "EN", name: en, widget: text }
          - { label: "中文", name: zh, widget: text }
          - { label: "عربي", name: ar, widget: text }
          - { label: "FR", name: fr, widget: text }
      - label: "一句话卖点 Tagline（4 语言）"
        name: tagline
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "产品介绍（4 语言，段落之间用空行分隔）"
        name: intro
        widget: object
        fields:
          - { label: "EN", name: en, widget: text }
          - { label: "中文", name: zh, widget: text }
          - { label: "عربي", name: ar, widget: text }
          - { label: "FR", name: fr, widget: text }
      - { label: "主图（可从媒体库选择或上传）", name: image, widget: image }
      - label: "主图 alt 描述（4 语言）"
        name: imageAlt
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "图集（可多张）"
        name: gallery
        widget: list
        fields:
          - { label: "图片", name: src, widget: image }
          - label: "alt 描述（4 语言）"
            name: alt
            widget: object
            fields:
              - { label: "EN", name: en, widget: string }
              - { label: "中文", name: zh, widget: string }
              - { label: "عربي", name: ar, widget: string }
              - { label: "FR", name: fr, widget: string }
      - label: "核心卖点（每条一行，4 语言）"
        name: highlights
        widget: object
        fields:
          - { label: "EN", name: en, widget: list, default: [] }
          - { label: "中文", name: zh, widget: list, default: [] }
          - { label: "عربي", name: ar, widget: list, default: [] }
          - { label: "FR", name: fr, widget: list, default: [] }
      - label: "应用场景（每条一行，4 语言）"
        name: applications
        widget: object
        fields:
          - { label: "EN", name: en, widget: list, default: [] }
          - { label: "中文", name: zh, widget: list, default: [] }
          - { label: "عربي", name: ar, widget: list, default: [] }
          - { label: "FR", name: fr, widget: list, default: [] }
      - label: "参数表（每行：参数名 + 参数值，各 4 语言）"
        name: specs
        widget: list
        label_singular: "参数行"
        fields:
          - label: "参数名（4 语言）"
            name: key
            widget: object
            fields:
              - { label: "EN", name: en, widget: string }
              - { label: "中文", name: zh, widget: string }
              - { label: "عربي", name: ar, widget: string }
              - { label: "FR", name: fr, widget: string }
          - label: "参数值（4 语言）"
            name: value
            widget: object
            fields:
              - { label: "EN", name: en, widget: string }
              - { label: "中文", name: zh, widget: string }
              - { label: "عربي", name: ar, widget: string }
              - { label: "FR", name: fr, widget: string }
      - label: "OEM 定制说明（4 语言）"
        name: oem
        widget: object
        fields:
          - { label: "EN", name: en, widget: text }
          - { label: "中文", name: zh, widget: text }
          - { label: "عربي", name: ar, widget: text }
          - { label: "FR", name: fr, widget: text }

  # ---------------- 常见问题 FAQ ----------------
  - name: faqs
    label: "常见问题 FAQ"
    label_singular: "问题 FAQ"
    folder: "src/data/faqs/items"
    create: true
    extension: json
    format: json
    identifier_field: slug
    slug: "{{slug}}"
    fields:
      - { label: "标识 slug（如 faq-moq）", name: slug, widget: string }
      - label: "问题（4 语言）"
        name: q
        widget: object
        fields:
          - { label: "EN", name: en, widget: text }
          - { label: "中文", name: zh, widget: text }
          - { label: "عربي", name: ar, widget: text }
          - { label: "FR", name: fr, widget: text }
      - label: "回答（4 语言）"
        name: a
        widget: object
        fields:
          - { label: "EN", name: en, widget: text }
          - { label: "中文", name: zh, widget: text }
          - { label: "عربي", name: ar, widget: text }
          - { label: "FR", name: fr, widget: text }

  # ---------------- 项目案例 ----------------
  - name: cases
    label: "项目案例 Cases"
    label_singular: "案例 Case"
    folder: "src/data/cases/items"
    create: true
    extension: json
    format: json
    identifier_field: slug
    slug: "{{slug}}"
    fields:
      - { label: "案例标识 slug", name: slug, widget: string }
      - label: "标题（4 语言）"
        name: title
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "项目类型（4 语言，如 度假村开发）"
        name: project
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "规模（4 语言，如 40+ 套）"
        name: units
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - { label: "案例图片", name: image, widget: image }
      - label: "图片 alt（4 语言）"
        name: alt
        widget: object
        fields:
          - { label: "EN", name: en, widget: string }
          - { label: "中文", name: zh, widget: string }
          - { label: "عربي", name: ar, widget: string }
          - { label: "FR", name: fr, widget: string }
      - label: "案例正文（4 语言，段落用空行分隔）"
        name: body
        widget: object
        fields:
          - { label: "EN", name: en, widget: text }
          - { label: "中文", name: zh, widget: text }
          - { label: "عربي", name: ar, widget: text }
          - { label: "FR", name: fr, widget: text }

  # ---------------- 站点设置（联系方式等） ----------------
  - name: settings
    label: "站点设置 Site Settings"
    editor:
      preview: false
    files:
      - name: site
        label: "品牌与联系方式（全站统一生效）"
        file: "src/data/site.json"
        fields:
          - { label: "品牌名 Brand", name: name, widget: string }
          - { label: "公司法定名称", name: legalName, widget: string }
          - { label: "集团", name: group, widget: string }
          - { label: "域名 Domain", name: domain, widget: string }
          - { label: "询盘邮箱（表单推送目标）", name: email, widget: string }
          - { label: "WhatsApp 号码（纯数字，含国家码）", name: whatsapp, widget: string }
          - { label: "WhatsApp 显示格式", name: whatsappDisplay, widget: string }
          - { label: "地址（短）", name: address, widget: string }
          - { label: "地址（完整）", name: addressFull, widget: string }
          - { label: "品牌口号 Slogan", name: slogan, widget: string }
          - label: "首页数据条（数字+文字，4 条）"
            name: stats
            widget: list
            fields:
              - { label: "数字", name: value, widget: string }
              - { label: "说明文字", name: label, widget: string }
